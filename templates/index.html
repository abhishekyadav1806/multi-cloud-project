<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Multi-Cloud File Upload</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 400px;
        }

        h1 {
            color: #1f2937;
            margin-bottom: 10px;
        }

        p {
            color: #6b7280;
            margin-bottom: 30px;
        }

        .file-input {
            margin-bottom: 20px;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Multi-Cloud File Upload</h1>

        <p>Upload your files securely to the cloud.</p>

        <form action="/upload" method="POST" enctype="multipart/form-data">

            <div class="file-input">
                <input type="file" name="file" required>
            </div>

            <button type="submit">
                Upload File
            </button>

        </form>

    </div>

</body>
</html>
